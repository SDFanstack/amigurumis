<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creando Ilusiones — Añadir amigurumi</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="admin-wrap">
  <div class="panel">
    <h2>Añadir un amigurumi nuevo</h2>

    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">

    <label for="nombre">Nombre del amigurumi</label>
    <input type="text" id="nombre" placeholder="Ej: Pulpito Rosa">

    <label for="descripcion">Descripción (opcional)</label>
    <textarea id="descripcion" placeholder="Ej: Hecho con lana merino y ojos de seguridad"></textarea>

    <label for="foto">Foto</label>
    <input type="file" id="foto" accept="image/*">
    <img id="preview" class="preview">

    <button class="submit" id="btnSubir">Subir a la web</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="panel" style="margin-top:28px;">
    <h2>Amigurumis subidos</h2>
    <div id="listaAmigurumis"><p style="color:#9a8a7d; font-size:.9rem;">Cargando...</p></div>
    <div class="msg" id="msgLista"></div>
  </div>

  <a class="back-link" href="index.html">&larr; Volver a la galería</a>
</div>

<script>
const WORKER_URL = 'https://amigurumis.sdfanstack.workers.dev/upload';

const fotoInput = document.getElementById('foto');
const preview = document.getElementById('preview');
const btn = document.getElementById('btnSubir');
const msg = document.getElementById('msg');

let fotoBase64 = null;

fotoInput.addEventListener('change', () => {
  const file = fotoInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    fotoBase64 = reader.result; // data:image/xxx;base64,....
    preview.src = fotoBase64;
    preview.style.display = 'block';
  };
  reader.readAsDataURL(file);
});

// Recordar la contraseña durante la sesión del navegador para no teclearla cada vez
const savedPass = sessionStorage.getItem('amigu_pass');
if(savedPass) document.getElementById('password').value = savedPass;

btn.addEventListener('click', async () => {
  const password = document.getElementById('password').value.trim();
  const nombre = document.getElementById('nombre').value.trim();
  const descripcion = document.getElementById('descripcion').value.trim();

  msg.className = 'msg';
  msg.style.display = 'none';

  if(!password || !nombre || !fotoBase64){
    msg.textContent = 'Falta la contraseña, el nombre o la foto.';
    msg.className = 'msg err';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Subiendo...';

  try{
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password, nombre, descripcion, imagen: fotoBase64 })
    });
    const data = await res.json();

    if(!res.ok){
      throw new Error(data.error || 'Error al subir');
    }

    sessionStorage.setItem('amigu_pass', password);
    msg.textContent = '¡Listo! En menos de un minuto aparecerá en la galería.';
    msg.className = 'msg ok';
    document.getElementById('nombre').value = '';
    document.getElementById('descripcion').value = '';
    fotoInput.value = '';
    preview.style.display = 'none';
    fotoBase64 = null;
    setTimeout(cargarLista, 1500);
  }catch(e){
    msg.textContent = 'No se ha podido subir: ' + e.message;
    msg.className = 'msg err';
  }finally{
    btn.disabled = false;
    btn.textContent = 'Subir a la web';
  }
});

// --- Lista de amigurumis y borrado ---
const listaDiv = document.getElementById('listaAmigurumis');
const msgLista = document.getElementById('msgLista');

async function cargarLista(){
  try{
    const res = await fetch('amigurumis.json', { cache: 'no-store' });
    const items = await res.json();

    if(!items || items.length === 0){
      listaDiv.innerHTML = '<p style="color:#9a8a7d; font-size:.9rem;">Todavía no hay ninguno subido.</p>';
      return;
    }

    listaDiv.innerHTML = items.map(item => `
      <div style="display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid #eee0d0;">
        <img src="${item.foto}" alt="${item.nombre}" style="width:52px; height:52px; object-fit:cover; border-radius:8px; flex-shrink:0;">
        <div style="flex:1; min-width:0;">
          <div style="font-weight:800; font-size:.92rem;">${item.nombre}</div>
          <div style="font-size:.75rem; color:#9a8a7d;">${item.fecha || ''}</div>
        </div>
        <button
          onclick="borrarAmigurumi('${item.id}', '${item.nombre.replace(/'/g, "\\'")}')"
          style="background:#8a2f2f; color:#fff; border:none; border-radius:8px; padding:8px 12px; font-family:'Nunito',sans-serif; font-weight:700; font-size:.8rem; cursor:pointer; flex-shrink:0;">
          Borrar
        </button>
      </div>
    `).join('');
  }catch(e){
    listaDiv.innerHTML = '<p style="color:#8a2f2f; font-size:.9rem;">No se ha podido cargar la lista.</p>';
  }
}

async function borrarAmigurumi(id, nombre){
  const password = document.getElementById('password').value.trim();
  if(!password){
    msgLista.textContent = 'Escribe la contraseña arriba antes de borrar.';
    msgLista.className = 'msg err';
    return;
  }
  if(!confirm(`¿Seguro que quieres borrar "${nombre}"? No se puede deshacer.`)) return;

  msgLista.className = 'msg';
  msgLista.style.display = 'none';

  try{
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password, accion: 'borrar', id })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Error al borrar');

    msgLista.textContent = `"${nombre}" borrado. Puede tardar un momento en desaparecer de la galería.`;
    msgLista.className = 'msg ok';
    setTimeout(cargarLista, 1000);
  }catch(e){
    msgLista.textContent = 'No se ha podido borrar: ' + e.message;
    msgLista.className = 'msg err';
  }
}

cargarLista();
</script>

</body>
</html>
